name: Multi-Agent Quality Gate CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Hủy các bản chạy cũ nếu Agent vừa đẩy code mới lên cùng 1 nhánh để tiết kiệm tài nguyên
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Khai báo phiên bản công nghệ tập trung (Dễ dàng thay đổi theo .ai-agents/project-context.md)
  GO_VERSION: '1.23'
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # CHỐT CHẶN 1: KIỂM TRA BẢO MẬT & CẤU TRÚC (Tương ứng Global Guardrails)
  # ==========================================================================
  guardrails-and-security:
    name: "1. Guardrails & Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiểm tra sự tồn tại của tài liệu Đặc tả & Cấu hình Agent
        run: |
          if [ ! -f "AGENTS.md" ] || [ ! -f ".ai-agents/project-context.md" ]; then
            echo "❌ LỖI: Thiếu file cấu hình điều phối đa tác nhân (AGENTS.md hoặc project-context.md)!"
            exit 1
          fi
          echo "✅ Cấu hình Multi-Agent hợp lệ."

      - name: Quét lộ lọt API Key / Secret (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # CHỐT CHẶN 2: XÁC MINH CODE CỦA BUILDER AGENT (Linter & Type-check)
  # ==========================================================================
  builder-verification:
    name: "2. Builder Agent Verification (Lint & Compile)"
    runs-on: ubuntu-latest
    needs: guardrails-and-security
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      # --- Kiểm tra phần Backend (Mặc định mẫu cho Go, có chú thích cho Python/PHP) ---
      - name: Thiết lập môi trường Backend (Go)
        if: hashFiles('go.mod') != '' || hashFiles('backend/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Chạy Backend Linter & Compile Check
        if: hashFiles('go.mod') != ''
        run: |
          go vet ./...
          go build -v ./...
        # [TÙY BIẾN]:
        # - Nếu dùng Python: thay bằng `pip install ruff && ruff check .`
        # - Nếu dùng PHP/Laravel: thay bằng `./vendor/bin/pint --test`

      # --- Kiểm tra phần Frontend (Node.js / TypeScript) ---
      - name: Thiết lập môi trường Frontend (Node.js)
        if: hashFiles('package.json') != '' || hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Chạy Frontend Linter & Type-check
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run lint --if-present
          npm run type-check --if-present

  # ==========================================================================
  # CHỐT CHẶN 3: CHẠY BỘ KIỂM THỬ CỦA QA AGENT (Unit & Integration Tests)
  # ==========================================================================
  qa-test-suite:
    name: "3. QA Agent Test Suite (Unit & Integration)"
    runs-on: ubuntu-latest
    needs: builder-verification

    # Khởi tạo Database & Cache thật để chạy Integration Test chuẩn xác
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Go cho kỳ kiểm thử
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Thực thi Unit Test, Race Detector & Kiểm tra Độ phủ (Coverage)
        if: hashFiles('go.mod') != ''
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Cờ -race giúp phát hiện lỗi xung đột đồng thời (Race Condition) theo đúng yêu cầu của QA Agent
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
        # [TÙY BIẾN]:
        # - Nếu dùng Python: thay bằng `pytest --cov=.`
        # - Nếu dùng PHP/Laravel: thay bằng `php artisan test`

  # ==========================================================================
  # CHỐT CHẶN 4: KIỂM ĐỊNH ĐÓNG GÓI CỦA DEVOPS AGENT (Docker Build)
  # ==========================================================================
  devops-packaging:
    name: "4. DevOps Packaging Verification (Docker Build)"
    runs-on: ubuntu-latest
    needs: qa-test-suite
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Kiểm tra đóng gói Docker Image (Multi-stage build & Caching)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: app-verification:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max